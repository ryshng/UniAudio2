[build-system]
requires = ["setuptools==69.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uniaudio2"
version = "0.1.0"
description = "UniAudio 2.0: A Unified Audio Language Model with Text-Aligned Factorized Audio Tokenization"
readme = "readme.md"
requires-python = ">=3.9"
license = { text = "To be specified" }
authors = [
    { name = "UniAudio 2.0 Team" }
]
dependencies = [
    "numpy==2.0.2",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "torchvision==0.21.0",
    "torchtune==0.4.0",
    "torchao==0.9.0",
    "tqdm==4.67.1",
    "traitlets==5.7.1",
    "traittypes==0.2.3",
    "transformers==4.57.0",
    "tokenizers==0.22.1",
    "ipykernel==6.17.1",
    "einops==0.8.1",
    "accelerate==1.12.0",
    "bitsandbytes==0.49.0",
    "vector-quantize-pytorch==1.27.15",
    "modelscope==1.33.0",
    "soundfile==0.14.0",
    "omegaconf==2.0.6",
    "typing_extensions==4.16.0",
    "PyYAML==6.0.3",
    "litgpt==0.4.11",
    "diffusers==0.39.0",
    "safetensors==0.8.0",
    "huggingface_hub==0.36.2",
    "nnAudio==0.3.4",
    "pytorch_lightning==2.6.6",
    "scipy==1.15.3",
    "datasets==2.21.0",
    "jiwer==4.0.0",
    "zhconv==1.4.3",
    "zhon==2.1.1",
    "editdistance==0.8.1",
    "regex==2026.9.29",
    "more-itertools==11.1.0",
    "absl-py==2.5.1",
    "langdetect==1.0.9",
    "immutabledict==4.3.1",
    "nltk==3.10.3",
    "librosa==0.11.0",
    "laion_clap==1.1.5",
    "openai-whisper==20250625",
    "peft==0.21.2",
    "soft-moe-pytorch==0.1.9",
    "encodec==0.1.1"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
# Optional: fairseq often needs install from source for compatibility
# Run after: pip install git+https://github.com/facebookresearch/fairseq.git

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]
fad = ["audioldm_eval"]
kaldi = ["kaldiio"]

[tool.setuptools.packages.find]
where = ["."]
include = ["evaluation", "llm_models", "llm_modules", "llm_utils", "metrics", "tools", "prompts"]
# exclude = ["tools.kaldi"]  # uncomment to omit Kaldi utils from installed package
